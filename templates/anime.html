{% extends "base.html" %} {% block title %}Anime Tracker{% endblock title %} {%
block head_extra %} {% if page.description %}
<meta name="description" content="{{ page.description | safe }}" />
{% endif %} {% endblock head_extra %} {% block content %}
<h1 class="text-4xl md:text-5xl font-extrabold text-white text-center">
    Anime Tracker
</h1>

<div class="mt-6 mx-1 md:mx-2 text-lg text-gray-300">
    <hr class="border-gray-700 my-4" />
    <section class="mb-12">
        <div class="flex justify-center">
            <a
                id="tracking"
                class="justify-center text-3xl font-bold focus:outline-none focus:ring-0"
                href="#tracking"
                aria-label="Anchor link for : Tracking"
            >
                Currently Watching / Tracking
            </a>
        </div>

        <div id="track-table" class="mt-4">
            <p class="text-gray-400">Loading...</p>
        </div>
    </section>

    <hr class="border-gray-700 my-4" />
    <section>
        <div class="flex justify-center">
            <a
                id="completed"
                class="justify-center text-3xl font-bold focus:outline-none focus:ring-0"
                href="#completed"
                aria-label="Anchor link for : Completed"
            >
                Completed
            </a>
        </div>

        <div id="completed-table" class="mt-4">
            <p class="text-gray-400">Loading...</p>
        </div>
    </section>
</div>

<script>
    const API_BASE = "{{ get_url(path='api') }}";

    (async () => {
        const trackContainer = document.getElementById("track-table");
        const completedContainer = document.getElementById("completed-table");

        try {
            const [trackResponse, completedResponse] = await Promise.all([
                fetch(`${API_BASE}/anime-track`),
                fetch(`${API_BASE}/anime-completed`),
            ]);

            if (!trackResponse.ok) {
                throw new Error(`Track API: HTTP ${trackResponse.status}`);
            }

            if (!completedResponse.ok) {
                throw new Error(
                    `Completed API: HTTP ${completedResponse.status}`,
                );
            }

            const [trackData, completedData] = await Promise.all([
                trackResponse.json(),
                completedResponse.json(),
            ]);

            const trackRows = trackData.content
                .split("\n")
                .map((line) => line.trim())
                .filter(
                    (line) =>
                        line && !line.startsWith("#") && line.includes("@"),
                )
                .map((line) => {
                    const index = line.lastIndexOf("@");

                    return {
                        name: line.substring(0, index).trim(),

                        episode: line.substring(index + 1).trim(),
                    };
                });

            trackContainer.innerHTML = "";

            const trackTable = document.createElement("div");
            trackTable.className =
                "relative overflow-x-auto shadow-md rounded-lg";
            const trackTableElement = document.createElement("table");
            trackTableElement.className =
                "w-full text-sm text-left text-gray-400";
            trackTableElement.innerHTML = `
                <thead class="text-xs text-gray-400 uppercase bg-gray-700">
                    <tr>
                        <th scope="col" class="px-6 py-3">
                            Anime
                        </th>

                        <th scope="col" class="px-6 py-3">
                            Next Episode
                        </th>
                    </tr>
                </thead>
            `;

            const trackBody = document.createElement("tbody");
            trackRows.forEach((row) => {
                const tr = document.createElement("tr");
                tr.className =
                    "odd:bg-gray-900 even:bg-gray-800 border-b border-gray-700";
                const name = document.createElement("td");
                name.className = "px-6 py-4";
                name.textContent = row.name;
                const episode = document.createElement("td");
                episode.className = "px-6 py-4";
                episode.textContent = row.episode;
                tr.appendChild(name);
                tr.appendChild(episode);
                trackBody.appendChild(tr);
            });

            trackTableElement.appendChild(trackBody);
            trackTable.appendChild(trackTableElement);
            trackContainer.appendChild(trackTable);

            const completedRows = completedData.content
                .split("\n")
                .map((line) => line.trim())
                .filter((line) => line && !line.startsWith("#"))
                .filter(Boolean)
                .map((line) => {
                    const match = line.match(/^(.*?)\s+s(\d+)$/i);
                    if (match) {
                        return {
                            name: match[1].trim(),
                            season: match[2],
                            status: "Watched",
                        };
                    }

                    return { name: line, season: "-", status: "Finished" };
                });

            completedContainer.innerHTML = "";

            const completedTable = document.createElement("div");
            completedTable.className =
                "relative overflow-x-auto shadow-md rounded-lg";
            const completedTableElement = document.createElement("table");
            completedTableElement.className =
                "w-full text-sm text-left text-gray-400";
            completedTableElement.innerHTML = `
                <thead class="text-xs text-gray-400 uppercase bg-gray-700">
                    <tr>
                        <th scope="col" class="px-6 py-3">
                            Anime
                        </th>

                        <th scope="col" class="px-6 py-3">
                            Season
                        </th>

                        <th scope="col" class="px-6 py-3">
                            Status
                        </th>
                    </tr>
                </thead>
            `;

            const completedBody = document.createElement("tbody");
            completedRows.forEach((row) => {
                const tr = document.createElement("tr");
                tr.className =
                    "odd:bg-gray-900 even:bg-gray-800 border-b border-gray-700";
                const name = document.createElement("td");
                name.className = "px-6 py-4";
                name.textContent = row.name;
                const season = document.createElement("td");
                season.className = "px-6 py-4";
                season.textContent = row.season;
                const status = document.createElement("td");
                status.className = "px-6 py-4";
                status.textContent = row.status;
                tr.appendChild(name);
                tr.appendChild(season);
                tr.appendChild(status);
                completedBody.appendChild(tr);
            });

            completedTableElement.appendChild(completedBody);
            completedTable.appendChild(completedTableElement);
            completedContainer.appendChild(completedTable);
        } catch (error) {
            console.error("Failed to load anime:", error);
            trackContainer.innerHTML = `
                <p class="text-red-400">
                    Failed to load tracking data.
                </p>
            `;

            completedContainer.innerHTML = `
                <p class="text-red-400">
                    Failed to load completed anime.
                </p>
            `;
        }
    })();
</script>

{% endblock content %}
