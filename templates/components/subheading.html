{% component subheading(text: string) %} {% set href = text |
regex_replace(pattern="[\\/#%<>\\[\\]\\(\\)`^{}|.]", rep="") |
regex_replace(pattern=" +", rep="-") | lower %}

<hr class="border-gray-700 my-4" />
<div class="flex justify-center">
    <a
        id="{{ href }}"
        class="justify-center text-3xl font-bold focus:outline-none focus:ring-0"
        href="#{{ href }}"
        aria-label="Anchor link for : {{ href }}"
    >
        {{ text | safe }}
    </a>
</div>
{% endcomponent subheading %}
